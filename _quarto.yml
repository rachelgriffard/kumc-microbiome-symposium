project:
  type: website
  output-dir: docs

website:
  title: "The Microbial City: An Introduction to Microbiome Analysis"
  description: "KUMC Microbiome Symposium Workshop"
  navbar:
    logo: assets/landlocked-city-1.png
    logo-dark: assets/beach-city.png
    logo-alt: "The Microbial City"
    left:
      - href: index.qmd
        text: Home

  page-footer:
    left: |
      <img src="assets/landlocked-city-1.png" height="52" style="vertical-align:middle; opacity:0.85;" alt="">
    center: "The Microbial City · KUMC Microbiome Symposium"
    right: |
      <img src="assets/beach-city.png" height="52" style="vertical-align:middle; opacity:0.85;" alt="">
    background: "#1B3A58"
    foreground: "#EBF4FB"

  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Introduction to Microbiome Analysis"
        contents:
          - text: "Introduction"
            href: index.qmd
          - text: "Types of Microbiome Data"
            href: types-of-microbiome-data.qmd
          - text: "What is 16S rRNA seq?"
            href: 16s-overview.qmd
      - section: "Targeted Amplicon Sequencing Analysis"
        contents:
          - section: "Preprocessing"
            contents:
              - text: "Sequencing & Confounders"
                href: 03-sequencing.qmd
              - text: "Amplification & Pooling"
                href: 02-amplification.qmd
              - text: "FASTQ Files"
                href: 04-fastq.qmd
              - text: "QC Reports"
                href: qc-reports.qmd
              - text: "Trimming & Truncation"
                href: trimming.qmd
              - text: "Denoising & Merging"
                href: denoising.qmd
              - text: "Normalization"
                href: normalization.qmd
          - section: "Downstream Analysis"
            contents:
              - text: "Taxonomy Assignment"
                href: taxonomy.qmd
              - text: "Guilds"
                href: guilds.qmd
              - text: "Diversity Analysis"
                href: 09-diversity-analysis.qmd
              - text: "Differential Abundance"
                href: diff-abundance.qmd
      - section: "Further Resources"
        contents:
          - text: "Public Sequencing Data"
            href: public-data.qmd
          - text: "KUMC Resources"
            href: kumc-resources.qmd
          - text: "External Resources"
            href: external-resources.qmd
          - text: "Citations"
            href: citations.qmd

format:
  html:
    theme:
      light: [sandstone, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-fold: true
    code-summary: "Show example"
    smooth-scroll: true
